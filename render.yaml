services:
  - type: web
    name: group7-land-statistics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BHUVAN_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: USE_NEW_FRONTEND
        value: "1"
